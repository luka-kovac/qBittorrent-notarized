name: Build notarized qBittorrent macOS release

on:
  schedule:
    # GitHub Actions cron schedules use UTC.
    - cron: "23 3 * * *"

  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Optional upstream tag, for example release-5.2.3"
        required: false
        type: string

      force_rebuild:
        description: "Rebuild even if the matching release already exists"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Serializing the entire workflow closes the race between checking for an
# existing release and publishing it.
concurrency:
  group: notarized-qbittorrent-release
  cancel-in-progress: false

jobs:
  resolve_upstream:
    name: Find upstream stable release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      local_tag: ${{ steps.resolve.outputs.local_tag }}
      should_build: ${{ steps.check.outputs.should_build }}

    steps:
      - name: Resolve and validate upstream release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${REQUESTED_TAG}" ]]; then
            TAG="${REQUESTED_TAG}"
          else
            TAG="$(
              gh api \
                repos/qbittorrent/qBittorrent/releases/latest \
                --jq '.tag_name'
            )"
          fi

          if [[ ! "${TAG}" =~ ^release-([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Unexpected upstream stable-release tag: ${TAG}" >&2
            exit 1
          fi

          VERSION="${BASH_REMATCH[1]}"
          LOCAL_TAG="notarized-${TAG}"

          # Confirm that this exact tag exists in the upstream repository.
          gh api \
            "repos/qbittorrent/qBittorrent/git/ref/tags/${TAG}" \
            --silent

          echo "Upstream tag: ${TAG}"
          echo "Upstream version: ${VERSION}"
          echo "Local release tag: ${LOCAL_TAG}"

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "local_tag=${LOCAL_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Check whether this release has already been built
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          LOCAL_TAG: ${{ steps.resolve.outputs.local_tag }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${FORCE_REBUILD}" == "true" ]]; then
            echo "A forced rebuild was requested."
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${LOCAL_TAG}" \
            --silent 2>/dev/null
          then
            echo "Release ${LOCAL_TAG} already exists; nothing to build."
            echo "should_build=false" >> "${GITHUB_OUTPUT}"
          else
            echo "Release ${LOCAL_TAG} does not exist; starting the build."
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
          fi

  build:
    name: >-
      Build (${{ matrix.qbt_gui }},
      libtorrent ${{ matrix.libtorrent.version }},
      Qt ${{ matrix.qt_version }})
    needs: resolve_upstream
    if: needs.resolve_upstream.outputs.should_build == 'true'
    runs-on: macos-latest

    permissions:
      actions: write
      contents: read
      statuses: write

    strategy:
      fail-fast: false
      matrix:
        libtorrent:
          - version: "2.1.0-rc1"
            boost_major_version: "1"
            boost_minor_version: "91"
            boost_patch_version: "0"
          - version: "2.0.12"
            boost_major_version: "1"
            boost_minor_version: "91"
            boost_patch_version: "0"
          - version: "1.2.20"
            boost_major_version: "1"
            boost_minor_version: "86"
            boost_patch_version: "0"
        qbt_gui: ["GUI=ON", "GUI=OFF"]
        qt_version: ["6.10.3"]

    env:
      boost_path: "${{ github.workspace }}/../boost"
      libtorrent_path: "${{ github.workspace }}/../libtorrent"

    steps:
      - name: Checkout exact upstream qBittorrent release
        uses: actions/checkout@v6
        with:
          repository: qbittorrent/qBittorrent
          ref: ${{ needs.resolve_upstream.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify qBittorrent version from source
        id: qbt_version
        env:
          EXPECTED_VERSION: ${{ needs.resolve_upstream.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION_FILE="src/base/version.h.in"

          MAJOR="$(awk '/#define QBT_VERSION_MAJOR/ {print $3}' "${VERSION_FILE}")"
          MINOR="$(awk '/#define QBT_VERSION_MINOR/ {print $3}' "${VERSION_FILE}")"
          BUGFIX="$(awk '/#define QBT_VERSION_BUGFIX/ {print $3}' "${VERSION_FILE}")"
          STATUS="$(
            awk '/#define QBT_VERSION_STATUS/ {print $3}' "${VERSION_FILE}" |
              tr -d '"'
          )"

          if [[ -n "${STATUS}" ]]; then
            FULL_VERSION="${MAJOR}.${MINOR}.${BUGFIX}-${STATUS}"
          else
            FULL_VERSION="${MAJOR}.${MINOR}.${BUGFIX}"
          fi

          if [[ "${FULL_VERSION}" != "${EXPECTED_VERSION}" ]]; then
            echo \
              "Tag/source version mismatch: expected ${EXPECTED_VERSION}, found ${FULL_VERSION}" \
              >&2
            exit 1
          fi

          echo "Detected qBittorrent version from source: v${FULL_VERSION}"
          echo "version=v${FULL_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        uses: nick-fields/retry@v4
        env:
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        with:
          timeout_seconds: 90
          retry_wait_seconds: 20
          max_attempts: 6
          command: |
            brew update > /dev/null
            brew install \
              openssl@3 zlib
            # preinstalled on the image: cmake ninja

      - name: Setup ccache
        uses: Chocobo1/setup-ccache-action@v1
        with:
          store_cache: true
          update_packager_index: false
          ccache_options: |
            max_size=1G

      - name: Install boost
        shell: bash
        run: |
          boost_url="https://archives.boost.io/release/${{ matrix.libtorrent.boost_major_version }}.${{ matrix.libtorrent.boost_minor_version }}.${{ matrix.libtorrent.boost_patch_version }}/source/boost_${{ matrix.libtorrent.boost_major_version }}_${{ matrix.libtorrent.boost_minor_version }}_${{ matrix.libtorrent.boost_patch_version }}.tar.gz"
          boost_url2="https://sourceforge.net/projects/boost/files/boost/${{ matrix.libtorrent.boost_major_version }}.${{ matrix.libtorrent.boost_minor_version }}.${{ matrix.libtorrent.boost_patch_version }}/boost_${{ matrix.libtorrent.boost_major_version }}_${{ matrix.libtorrent.boost_minor_version }}_${{ matrix.libtorrent.boost_patch_version }}.tar.gz"
          set +e
          curl -L -o "${{ runner.temp }}/boost.tar.gz" "${boost_url}"
          tar -xf "${{ runner.temp }}/boost.tar.gz" -C "${{ github.workspace }}/.."
          _exitCode="$?"
          if [[ "${_exitCode}" -ne 0 ]]; then
            curl -L -o "${{ runner.temp }}/boost.tar.gz" "${boost_url2}"
            tar -xf "${{ runner.temp }}/boost.tar.gz" -C "${{ github.workspace }}/.."
          fi
          mv "${{ github.workspace }}/.."/boost_* "${{ env.boost_path }}"
          cd "${{ env.boost_path }}"
          ./bootstrap.sh
          ./b2 stage --stagedir=./ --with-headers

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          archives: qtbase qtdeclarative qtsvg qttools
          modules: qtimageformats
          # Qt made qtdeclarative a hard dependency. Recheck when the Qt
          # dependency layout changes.
          cache: true

      - name: Install libtorrent
        shell: bash
        run: |
          git clone \
            --branch "v${{ matrix.libtorrent.version }}" \
            --depth 1 \
            --recurse-submodules \
            https://github.com/arvidn/libtorrent.git \
            "${{ env.libtorrent_path }}"
          cd "${{ env.libtorrent_path }}"
          cmake \
            -B build \
            -G "Ninja" \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBOOST_ROOT="${{ env.boost_path }}/lib/cmake" \
            -Ddeprecated-functions=OFF
          cmake --build build
          sudo cmake --install build

      - name: Install Apple certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          CERTIFICATE_PATH="${RUNNER_TEMP}/build_certificate.p12"
          KEYCHAIN_PATH="${RUNNER_TEMP}/app-signing.keychain-db"

          echo "${BUILD_CERTIFICATE_BASE64}" |
            base64 --decode > "${CERTIFICATE_PATH}"

          if [[ ! -s "${CERTIFICATE_PATH}" ]]; then
            echo \
              "ERROR: Decoded certificate file is empty. Check BUILD_CERTIFICATE_BASE64." \
              >&2
            exit 1
          fi

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

          security import "${CERTIFICATE_PATH}" \
            -P "${P12_PASSWORD}" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "${KEYCHAIN_PATH}"

          security default-keychain -s "${KEYCHAIN_PATH}"
          security list-keychains \
            -d user \
            -s "${KEYCHAIN_PATH}" \
            $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${KEYCHAIN_PASSWORD}" \
            "${KEYCHAIN_PATH}"

          echo "=== AVAILABLE SIGNING IDENTITIES IN CI RUNNER ==="
          security find-identity -v -p codesigning
          echo "================================================"

      - name: Build qBittorrent
        shell: bash
        run: |
          CXXFLAGS="$CXXFLAGS -DQT_FORCE_ASSERTS -Werror -Wno-error=deprecated-declarations" \
          LDFLAGS="$LDFLAGS -gz" \
          cmake \
            -B build \
            -G "Ninja" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBOOST_ROOT="${{ env.boost_path }}/lib/cmake" \
            -DTESTING=ON \
            -DVERBOSE_CONFIGURE=ON \
            -D${{ matrix.qbt_gui }}
          cmake --build build --target qbt_update_translations
          cmake --build build
          cmake --build build --target check

          if [[ "${{ matrix.qbt_gui }}" == "GUI=ON" ]]; then
            build/qbittorrent.app/Contents/MacOS/qbittorrent -v
          else
            build/qbittorrent-nox.app/Contents/MacOS/qbittorrent-nox -v
          fi

      - name: Prepare, sign, and notarize build artifacts
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          DEVELOPER_NAME: ${{ secrets.DEVELOPER_NAME }}
        shell: bash
        run: |
          appName="qbittorrent"
          if [[ "${{ matrix.qbt_gui }}" == "GUI=OFF" ]]; then
            appName="qbittorrent-nox"
          fi

          pushd build

          # Run the deployment tool, retaining the existing tolerance for
          # non-critical plugin deployment errors.
          macdeployqt "${appName}.app" -no-strip || true

          # Remove optional SQL plugins that can fail Apple's bundle-layout
          # validation after deployment.
          if [[ -d "${appName}.app/Contents/PlugIns/sqldrivers" ]]; then
            echo "Removing optional SQL plugins..."
            rm -rf "${appName}.app/Contents/PlugIns/sqldrivers"
          fi

          # Repair framework symlinks that macdeployqt can leave incomplete.
          echo "Repairing internal framework symlinks..."
          if [[ -d "${appName}.app/Contents/Frameworks" ]]; then
            for framework in "${appName}.app/Contents/Frameworks"/*.framework; do
              if [[ -d "${framework}" ]]; then
                fw_name="$(basename "${framework}" .framework)"

                if [[ -d "${framework}/Versions/A" ]] &&
                  [[ ! -L "${framework}/Versions/Current" ]] &&
                  [[ ! -d "${framework}/Versions/Current" ]]
                then
                  ln -s A "${framework}/Versions/Current"
                fi

                if [[ ! -L "${framework}/${fw_name}" ]] &&
                  [[ -f "${framework}/Versions/Current/${fw_name}" ]]
                then
                  ln -s \
                    "Versions/Current/${fw_name}" \
                    "${framework}/${fw_name}"
                fi

                if [[ ! -L "${framework}/Resources" ]] &&
                  [[ -d "${framework}/Versions/Current/Resources" ]]
                then
                  ln -s \
                    "Versions/Current/Resources" \
                    "${framework}/Resources"
                fi
              fi
            done
          fi

          xattr -cr "${appName}.app"

          SIGN_IDENTITY="Developer ID Application: ${DEVELOPER_NAME} (${TEAM_ID})"
          echo "Signing with identity: ${SIGN_IDENTITY}"

          if [[ -d "${appName}.app/Contents/PlugIns" ]]; then
            find "${appName}.app/Contents/PlugIns" \
              -type f \
              \( -name "*.dylib" -o -perm +111 \) \
              -exec codesign \
                --force \
                --options runtime \
                --timestamp \
                --sign "${SIGN_IDENTITY}" \
                {} \;
          fi

          if [[ -d "${appName}.app/Contents/Frameworks" ]]; then
            find "${appName}.app/Contents/Frameworks" \
              -type f \
              \( -name "*.dylib" -o -name "*.framework" -o -perm +111 \) \
              -exec codesign \
                --force \
                --options runtime \
                --timestamp \
                --sign "${SIGN_IDENTITY}" \
                {} \;
          fi

          codesign \
            --force \
            --options runtime \
            --timestamp \
            --sign "${SIGN_IDENTITY}" \
            "${appName}.app/Contents/MacOS/${appName}"
          codesign \
            --force \
            --options runtime \
            --timestamp \
            --sign "${SIGN_IDENTITY}" \
            "${appName}.app"

          echo "Verifying signature structure..."
          codesign --verify --deep --strict -v "${appName}.app"

          echo "Packaging ZIP for Apple notarization..."
          ditto -c -k --keepParent "${appName}.app" "${appName}.zip"

          echo "Submitting to Apple Notary Service..."
          xcrun notarytool submit "${appName}.zip" \
            --apple-id "${APPLE_ID}" \
            --password "${APP_SPECIFIC_PASSWORD}" \
            --team-id "${TEAM_ID}" \
            --wait

          echo "Stapling notarization ticket..."
          xcrun stapler staple "${appName}.app"

          echo "Generating final distribution DMG..."
          hdiutil create \
            -fs HFS+ \
            -srcfolder "${appName}.app" \
            -volname "${appName}" \
            "${appName}.dmg"

          popd

          mkdir upload
          cp "build/${appName}.dmg" upload
          mkdir upload/cmake
          cp build/compile_commands.json upload/cmake
          mkdir upload/cmake/libtorrent
          cp \
            "${{ env.libtorrent_path }}/build/compile_commands.json" \
            upload/cmake/libtorrent

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: qBittorrent-CI_macOS_${{ matrix.qbt_gui }}_libtorrent-${{ matrix.libtorrent.version }}_Qt-${{ matrix.qt_version }}
          path: upload
          if-no-files-found: error

  publish:
    name: Publish notarized release
    needs:
      - resolve_upstream
      - build
    if: >-
      needs.resolve_upstream.outputs.should_build == 'true' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: write

    steps:
      - name: Download all macOS build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: qBittorrent-CI_macOS_*
          path: release-assets
          merge-multiple: false

      - name: Prepare uniquely named release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          dmg_count=0
          while IFS= read -r -d '' FILE; do
            ARTIFACT_DIR="$(basename "$(dirname "${FILE}")")"
            SAFE_NAME="$(
              printf '%s' "${ARTIFACT_DIR}" |
                sed 's/[^A-Za-z0-9._-]/-/g'
            )"

            cp "${FILE}" "dist/${SAFE_NAME}.dmg"
            dmg_count=$((dmg_count + 1))
          done < <(
            find release-assets -type f -name '*.dmg' -print0
          )

          if [[ "${dmg_count}" -eq 0 ]]; then
            echo "No DMG files were downloaded." >&2
            exit 1
          fi

          echo "Prepared ${dmg_count} release assets:"
          find dist -maxdepth 1 -type f -name '*.dmg' -print

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve_upstream.outputs.local_tag }}
          target_commitish: ${{ github.sha }}
          name: >-
            qBittorrent Notarized
            v${{ needs.resolve_upstream.outputs.version }}
          body: |
            Automated custom notarized macOS builds of qBittorrent.

            This build is not affiliated with or supported by the main
            qBittorrent project.

            - **Upstream repository:** `qbittorrent/qBittorrent`
            - **Upstream tag:** `${{ needs.resolve_upstream.outputs.tag }}`
            - **Source version:** `v${{ needs.resolve_upstream.outputs.version }}`
            - **Status:** Signed with Developer ID and notarized by Apple
            - **Variants:** GUI and nox builds for each configured libtorrent version
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
