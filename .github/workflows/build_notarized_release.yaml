name: Build notarized qBittorrent macOS release

on:
  schedule:
    # GitHub Actions cron schedules use UTC.
    - cron: "23 3 * * *"

  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Optional upstream tag, for example release-5.2.3"
        required: false
        type: string

      force_rebuild:
        description: "Rebuild even if the matching release already exists"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Serializing the entire workflow closes the race between checking for an
# existing release and publishing it.
concurrency:
  group: notarized-qbittorrent-release
  cancel-in-progress: false

jobs:
  resolve_upstream:
    name: Find upstream stable release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      local_tag: ${{ steps.resolve.outputs.local_tag }}
      should_build: ${{ steps.check.outputs.should_build }}
      matrix: ${{ steps.upstream_matrix.outputs.matrix }}
      runner: ${{ steps.upstream_matrix.outputs.runner }}
      fail_fast: ${{ steps.upstream_matrix.outputs.fail_fast }}
      max_parallel: ${{ steps.upstream_matrix.outputs.max_parallel }}
      timeout: ${{ steps.upstream_matrix.outputs.timeout }}

    steps:
      - name: Resolve and validate upstream release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${REQUESTED_TAG}" ]]; then
            TAG="${REQUESTED_TAG}"
          else
            TAG="$(
              gh api \
                repos/qbittorrent/qBittorrent/releases/latest \
                --jq '.tag_name'
            )"
          fi

          if [[ ! "${TAG}" =~ ^release-([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Unexpected upstream stable-release tag: ${TAG}" >&2
            exit 1
          fi

          VERSION="${BASH_REMATCH[1]}"
          LOCAL_TAG="notarized-${TAG}"

          # Confirm that this exact tag exists in the upstream repository.
          gh api \
            "repos/qbittorrent/qBittorrent/git/ref/tags/${TAG}" \
            --silent

          echo "Upstream tag: ${TAG}"
          echo "Upstream version: ${VERSION}"
          echo "Local release tag: ${LOCAL_TAG}"

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "local_tag=${LOCAL_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Check whether this release has already been built
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          LOCAL_TAG: ${{ steps.resolve.outputs.local_tag }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${FORCE_REBUILD}" == "true" ]]; then
            echo "A forced rebuild was requested."
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${LOCAL_TAG}" \
            --silent 2>/dev/null
          then
            echo "Release ${LOCAL_TAG} already exists; nothing to build."
            echo "should_build=false" >> "${GITHUB_OUTPUT}"
          else
            echo "Release ${LOCAL_TAG} does not exist; starting the build."
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout release tooling
        if: steps.check.outputs.should_build == 'true'
        uses: actions/checkout@v6
        with:
          path: release-tools
          persist-credentials: false

      - name: Set up Ruby for upstream workflow parsing
        if: steps.check.outputs.should_build == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Prepare the exact upstream macOS build
        if: steps.check.outputs.should_build == 'true'
        id: upstream_matrix
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.resolve.outputs.tag }}
          UPSTREAM_WORKFLOW: ${{ runner.temp }}/upstream-ci-macos.yaml
          ACTION_DIR: ${{ runner.temp }}/upstream-build
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            "repos/qbittorrent/qBittorrent/contents/.github/workflows/ci_macos.yaml?ref=${UPSTREAM_TAG}" \
            --jq '.content' |
            base64 --decode > "${UPSTREAM_WORKFLOW}"

          ruby release-tools/.github/scripts/prepare_upstream.rb \
            "${UPSTREAM_WORKFLOW}" "${ACTION_DIR}"
          cp release-tools/.github/scripts/notarize.sh "${ACTION_DIR}/notarize.sh"

      - name: Share the upstream build action
        if: steps.check.outputs.should_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: upstream-build-action
          path: ${{ runner.temp }}/upstream-build
          if-no-files-found: error
          retention-days: 1

  build:
    name: >-
      Build (${{ matrix.qbt_gui }},
      libtorrent ${{ matrix.libtorrent.version }},
      Qt ${{ matrix.qt_version }})
    needs: resolve_upstream
    if: needs.resolve_upstream.outputs.should_build == 'true'
    runs-on: ${{ fromJSON(needs.resolve_upstream.outputs.runner) }}
    timeout-minutes: ${{ fromJSON(needs.resolve_upstream.outputs.timeout) }}

    permissions:
      actions: write
      contents: read

    strategy:
      fail-fast: ${{ fromJSON(needs.resolve_upstream.outputs.fail_fast) }}
      max-parallel: ${{ fromJSON(needs.resolve_upstream.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.resolve_upstream.outputs.matrix) }}

    steps:
      - name: Checkout exact upstream qBittorrent release
        uses: actions/checkout@v7
        with:
          repository: qbittorrent/qBittorrent
          ref: ${{ needs.resolve_upstream.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify qBittorrent version from source
        id: qbt_version
        env:
          EXPECTED_VERSION: ${{ needs.resolve_upstream.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION_FILE="src/base/version.h.in"

          MAJOR="$(awk '/#define QBT_VERSION_MAJOR/ {print $3}' "${VERSION_FILE}")"
          MINOR="$(awk '/#define QBT_VERSION_MINOR/ {print $3}' "${VERSION_FILE}")"
          BUGFIX="$(awk '/#define QBT_VERSION_BUGFIX/ {print $3}' "${VERSION_FILE}")"
          STATUS="$(
            awk '/#define QBT_VERSION_STATUS/ {print $3}' "${VERSION_FILE}" |
              tr -d '"'
          )"

          if [[ -n "${STATUS}" ]]; then
            FULL_VERSION="${MAJOR}.${MINOR}.${BUGFIX}-${STATUS}"
          else
            FULL_VERSION="${MAJOR}.${MINOR}.${BUGFIX}"
          fi

          if [[ "${FULL_VERSION}" != "${EXPECTED_VERSION}" ]]; then
            echo \
              "Tag/source version mismatch: expected ${EXPECTED_VERSION}, found ${FULL_VERSION}" \
              >&2
            exit 1
          fi

          echo "Detected qBittorrent version from source: v${FULL_VERSION}"
          echo "version=v${FULL_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Download the upstream build action
        uses: actions/download-artifact@v8
        with:
          name: upstream-build-action
          path: .notarized-release/upstream-build

      - name: Run upstream build with Developer ID signing and notarization
        uses: ./.notarized-release/upstream-build
        with:
          matrix: ${{ toJSON(matrix) }}
          build_certificate_base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12_password: ${{ secrets.P12_PASSWORD }}
          keychain_password: ${{ secrets.KEYCHAIN_PASSWORD }}
          apple_id: ${{ secrets.APPLE_ID }}
          app_specific_password: ${{ secrets.APP_SPECIFIC_PASSWORD }}
          team_id: ${{ secrets.TEAM_ID }}
          developer_name: ${{ secrets.DEVELOPER_NAME }}

  publish:
    name: Publish notarized release
    needs:
      - resolve_upstream
      - build
    if: >-
      needs.resolve_upstream.outputs.should_build == 'true' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout release naming tools
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Download all macOS build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: qBittorrent-CI_macOS_*
          path: release-assets
          merge-multiple: false

      - name: Prepare upstream-style notarized release names
        env:
          QBT_VERSION: ${{ needs.resolve_upstream.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/prepare_release_assets.py \
            release-assets dist "${QBT_VERSION}"

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve_upstream.outputs.local_tag }}
          target_commitish: ${{ github.sha }}
          name: >-
            qBittorrent v${{ needs.resolve_upstream.outputs.version }} (Notarized)
          body: |
            Automated custom notarized macOS builds of qBittorrent.

            This build is not affiliated with or supported by the main
            qBittorrent project.

            - **Upstream repository:** `qbittorrent/qBittorrent`
            - **Upstream tag:** `${{ needs.resolve_upstream.outputs.tag }}`
            - **Source version:** `v${{ needs.resolve_upstream.outputs.version }}`
            - **Status:** Signed with Developer ID and notarized by Apple
            - **Variants:** GUI and nox builds for each configured libtorrent version
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
